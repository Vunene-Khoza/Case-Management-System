# Server Configuration
server.port=8080

# Database Configuration (MySQL on localhost:3306)
spring.datasource.url=jdbc:mysql://localhost:3306/univen_case_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Ledge.98
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
# 'create' on FIRST startup creates all tables fresh from JPA entities
# After schema is confirmed OK in MySQL, change to 'update' to preserve data
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# SQL Init Scripts: 'always' runs data.sql after Hibernate DDL completes
spring.sql.init.mode=always

# Jackson Date Formatting (ISO 8601 UTC)
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Application JWT Configuration
app.jwt.secret=9a2f8c4e7b1d3f5a8e0c2b4d6f8a1e3c5b7d9f2a4e6c8b0d2f4a6c8e0b2d4f6a
app.jwt.expiration-ms=86400000

# Admin-only scope active (disable non-admin endpoints for now)
app.admin-only-mode=true
