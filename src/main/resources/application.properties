# Server Configuration
server.port=8080

# Database Configuration (MySQL on localhost:3306)
spring.datasource.url=jdbc:mysql://localhost:3306/univen_case_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Date Formatting (ISO 8601 UTC)
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Application JWT Configuration
app.jwt.secret=9a2f8c4e7b1d3f5a8e0c2b4d6f8a1e3c5b7d9f2a4e6c8b0d2f4a6c8e0b2d4f6a
app.jwt.expiration-ms=86400000
